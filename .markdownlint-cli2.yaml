config:
  extends: "markdownlint/style/prettier"
  line-length: { line_length: 100 }

ignores:
  - node_modules
  - .claude/**
  # OpenSpec's own templates (proposal/design/tasks/specs) dictate their
  # own shape (## as the first heading, long single-paragraph bullets) -
  # not prose this repo's house style governs. Archived main specs under
  # openspec/specs/ carry the same shape once synced from a change.
  - openspec/changes/**
  - openspec/specs/**
