# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck -x {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes - every job below runs in check mode.
pre-push:
  parallel: true
  jobs:
    - name: shellcheck
      run: shellcheck -x scripts/*.sh

    - name: actionlint
      run: actionlint

    - name: bats
      run: bats tests/*.bats

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md
